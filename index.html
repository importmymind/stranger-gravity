<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stranger Gravity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <button id="mute-btn"
        class="fixed top-5 right-5 z-[9999] text-3xl cursor-pointer hover:scale-110 transition-transform bg-transparent border-none outline-none text-red-600 drop-shadow-[0_0_5px_rgba(0,0,0,0.8)]">
        🔊
    </button>

    <div id="intro-overlay"
        class="fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center transition-opacity duration-[2000ms]">
        <div class="grain"></div>
        <div class="intro-container relative w-full max-w-4xl px-4 flex flex-col items-center">
            <div class="w-2/3 h-[2px] bg-red-600 shadow-[0_0_15px_#f00] mb-8 intro-lines"></div>
            <div class="relative text-center">
                <h1 class="text-6xl md:text-9xl font-bold uppercase intro-text leading-none"
                    style="will-change: transform, opacity; transform: translateZ(0);">
                    Stranger<br />GRAVITY
                    <div
                        class="intro-text-fill w-full h-full absolute inset-0 flex flex-col items-center justify-center leading-none">
                        Stranger<br />GRAVITY
                    </div>
                </h1>
            </div>
            <div class="w-2/3 h-[2px] bg-red-600 shadow-[0_0_15px_#f00] mt-8 intro-lines" style="animation-delay: 0.8s">
            </div>

            <button id="enter-wall-btn"
                class="mt-20 px-8 py-3 border border-red-600 text-red-500 font-mono tracking-[0.3em] text-sm hover:bg-red-900/20 hover:text-red-400 hover:shadow-[0_0_20px_rgba(255,0,0,0.4)] transition-all duration-500 opacity-0 animate-[fillText_1s_ease-out_forwards_3s] cursor-pointer z-[101]">
                ENTER THE ROOM
            </button>
        </div>
    </div>

    <div id="wall-content"
        class="absolute inset-0 z-[80] transition-all duration-[2000ms] opacity-0 filter blur-sm pointer-events-none"
        style="display: none;">
        <div class="fixed inset-0 wall-pattern z-0"></div>
        <div class="fixed inset-0 vignette z-10 pointer-events-none"></div>
        <div id="demogorgon-overlay"
            class="fixed inset-0 z-20 pointer-events-none transition-opacity duration-100 opacity-0 bg-red-900/40">
        </div>

        <div class="wall-scale-container relative z-30">
            <div class="text-center mb-2">
                <h1
                    class="text-5xl md:text-7xl text-red-600 font-title tracking-widest drop-shadow-[0_0_10px_rgba(255,0,0,0.8)] border-red-600 text-stroke-2">
                    ONE LAST MESSAGE
                </h1>
                <p class="text-red-900 font-mono text-xs tracking-[0.3em] mt-2 opacity-80 uppercase font-bold">
                    BEFORE THE UPSIDE DOWN
                </p>
            </div>

            <div
                class="w-full max-w-[95vw] xl:max-w-7xl relative mb-4 flex flex-col items-center gap-y-1 md:gap-y-4 py-4 px-2 bg-black/20 rounded-xl backdrop-blur-sm border border-white/5 shadow-2xl">
                <div id="row-1" class="flex justify-center w-full flex-nowrap relative"></div>
                <div id="row-2" class="flex justify-center w-full flex-nowrap relative translate-x-0 md:translate-x-4">
                </div>
                <div id="row-3"
                    class="flex justify-center w-full flex-nowrap relative translate-x-0 md:-translate-x-4">
                </div>
            </div>

            <div
                class="w-full max-w-2xl bg-gray-900/90 p-6 rounded-2xl border-2 border-red-900/50 shadow-[0_0_40px_rgba(0,0,0,0.8)] backdrop-blur-md mt-2 md:mt-6">

                <div class="flex gap-4 mb-4">
                    <input id="message-input" type="text" maxlength="30" placeholder="TYPE MESSAGE..."
                        class="flex-1 bg-black/60 border-2 border-gray-600 text-white px-5 py-3 rounded-xl focus:outline-none focus:border-red-600 focus:shadow-[0_0_20px_rgba(220,38,38,0.5)] font-mono tracking-widest placeholder:text-gray-600 uppercase text-lg md:text-xl transition-all">
                </div>

                <div class="grid grid-cols-3 gap-3 mb-6">
                    <button id="play-btn"
                        class="flex items-center justify-center py-3 bg-gray-800 text-gray-500 rounded-lg font-bold tracking-widest transition-all text-xs md:text-base cursor-not-allowed border border-gray-700"
                        disabled>LIGHT UP</button>

                    <button id="stop-btn"
                        class="hidden flex items-center justify-center py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-bold tracking-widest border border-gray-600 text-xs md:text-base shadow-[0_0_15px_rgba(255,255,255,0.2)]">STOP</button>

                    <button id="clear-btn"
                        class="flex items-center justify-center py-3 bg-transparent border-2 border-gray-600 hover:border-gray-400 text-gray-400 hover:text-white rounded-lg font-bold tracking-widest transition-all text-xs md:text-base hover:shadow-[0_0_15px_rgba(255,255,255,0.2)]">CLEAR</button>

                    <button id="demo-btn"
                        class="flex items-center justify-center py-3 bg-red-900/20 border-2 border-red-900 text-red-500 hover:bg-red-900/40 rounded-lg font-bold tracking-widest transition-all animate-pulse text-xs md:text-base hover:shadow-[0_0_20px_rgba(220,38,38,0.4)]">DEMO</button>
                </div>

                <button id="go-to-game-btn"
                    class="w-full py-4 bg-red-700 hover:bg-red-600 text-white text-xl md:text-3xl font-bold tracking-[0.2em] rounded-xl border-4 border-red-500 shadow-[0_0_30px_rgba(220,38,38,0.6)] hover:shadow-[0_0_60px_rgba(220,38,38,0.9)] hover:scale-[1.02] active:scale-95 transition-all">
                    START RUN
                </button>
            </div>
        </div>
    </div>

    <div id="game-container" class="hidden fixed inset-0 z-40 bg-black" style="display: none;">
        <canvas id="gameCanvas"></canvas>

        <div id="menu-screen"
            class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-sm">
            <div
                class="relative w-full max-w-4xl p-8 border-2 border-red-600 rounded-3xl bg-black shadow-[0_0_50px_rgba(220,38,38,0.5)] flex flex-col items-center">

                <h1
                    class="text-4xl md:text-6xl mb-2 text-red-600 font-title tracking-widest text-shadow-red text-center leading-tight">
                    ASSEMBLE YOUR TEAM
                </h1>

                <p class="text-gray-400 text-xs md:text-sm font-mono tracking-[0.2em] mb-4 uppercase text-center">
                    Select characters for <span class="text-red-500 font-bold">MULTIPLAYER</span>
                </p>

                <div id="selected-list"
                    class="text-lg text-white mb-4 font-mono text-center min-h-[28px] drop-shadow-[0_0_5px_rgba(255,255,255,0.8)]">
                </div>

                <div id="char-selection-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-8 mb-6"></div>

                <button onclick="startGame()"
                    class="game-btn text-xl px-10 py-3 shadow-[0_0_20px_rgba(220,38,38,0.4)] hover:scale-105 transition-transform">
                    START GAME
                </button>
            </div>
        </div>

        <div id="score-board">SCORE: 0</div>

        <div id="game-over-screen" style="display: none;">
            <h1 class="text-5xl text-red-600 font-title mb-6 tracking-widest" style="text-shadow: 0 0 20px red;">GAME
                OVER</h1>
            <p class="mb-2 text-gray-300">Distance: <span id="dist-score" class="text-white">0</span></p>
            <p class="mb-6 text-gray-300">Waffles: <span id="waffle-score" class="text-yellow-400">0</span></p>
            <h2 class="total-score text-3xl mb-8 border-b-2 border-red-600 pb-4">TOTAL: <span id="final-total">0</span>
            </h2>

            <button onclick="restartGame()" class="game-btn w-full mb-3">TRY AGAIN</button>
            <button onclick="location.reload()" class="game-btn game-btn-outline w-full text-sm">MAIN MENU</button>
        </div>
    </div>

    <div id="assets" style="display: none;">
        <img id="char-mike" src="assets/images/mike.png">
        <img id="char-will" src="assets/images/will.png">
        <img id="char-eleven" src="assets/images/eleven.png">
        <img id="char-dustin" src="assets/images/dustin.png">
        <img id="char-lucas" src="assets/images/lucas.png">
        <img id="char-max" src="assets/images/max.png">
        <img id="char-demo" src="assets/images/demogorgon.png">
        <img id="char-vecna" src="assets/images/vecna.png">
        <img id="bg-upsidedown" src="assets/images/upsidedown_bg.jpg">
        <img id="bg-normal" src="assets/images/normal_bg.jpg">
        <img id="item-waffle" src="assets/images/waffle.png">
    </div>

    <audio id="music-intro" src="assets/audio/intro.m4a" loop preload="auto"></audio>
    <audio id="music-chase" src="assets/audio/game.m4a" loop preload="auto"></audio>

    <script src="js/game.js"></script>
</body>

</html>
